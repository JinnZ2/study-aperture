name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run all checks (stdlib only, no installs)
        run: ./run_checks.sh
      - name: Capture audit-process replay evidence
        if: always()
        run: |
          PYTHONPATH=experimental python3 -m playground.audits.tolman_process \
            --output-dir "$RUNNER_TEMP/tolman-audit-process"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tolman-audit-process-python-${{ matrix.python }}
          path: ${{ runner.temp }}/tolman-audit-process
          if-no-files-found: error
      - name: Capture second audit-process evidence
        if: always()
        run: |
          PYTHONPATH=experimental python3 -m playground.audits.pendulum_process \
            --output-dir "$RUNNER_TEMP/pendulum-audit-process"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pendulum-audit-process-python-${{ matrix.python }}
          path: ${{ runner.temp }}/pendulum-audit-process
          if-no-files-found: error
      - name: Capture third audit-process measurement boundary evidence
        if: always()
        run: |
          PYTHONPATH=experimental python3 -m playground.audits.measurement_process \
            --output-dir "$RUNNER_TEMP/measurement-boundary-audit-process"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measurement-boundary-audit-process-python-${{ matrix.python }}
          path: ${{ runner.temp }}/measurement-boundary-audit-process
          if-no-files-found: error
      - name: Capture constructed measurand-identity substitution evidence
        if: always()
        run: |
          PYTHONPATH=experimental python3 -m playground.equations.measurand_example \
            --output-dir "$RUNNER_TEMP/measurand-substitution-probe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measurand-substitution-python-${{ matrix.python }}
          path: ${{ runner.temp }}/measurand-substitution-probe
          if-no-files-found: error
      - name: Capture constructed denominator-procedure audit evidence
        if: always()
        run: |
          PYTHONPATH=experimental python3 -m playground.audits.denominator_process \
            --output-dir "$RUNNER_TEMP/denominator-change-audit"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: denominator-change-audit-python-${{ matrix.python }}
          path: ${{ runner.temp }}/denominator-change-audit
          if-no-files-found: error
      - name: Capture constructed distribution-to-mean substitution evidence
        if: always()
        run: |
          PYTHONPATH=experimental python3 -m playground.audits.distribution_mean_process \
            --output-dir "$RUNNER_TEMP/distribution-to-mean-audit"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distribution-to-mean-audit-python-${{ matrix.python }}
          path: ${{ runner.temp }}/distribution-to-mean-audit
          if-no-files-found: error
      - name: Capture constructed cross-audit regression evidence
        if: always()
        run: |
          PYTHONPATH=experimental python3 -m playground.audits.cross_audit_regression \
            --output-dir "$RUNNER_TEMP/cross-audit-regression"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-audit-regression-python-${{ matrix.python }}
          path: ${{ runner.temp }}/cross-audit-regression
          if-no-files-found: error

name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run all checks (stdlib only, no installs)
        run: ./run_checks.sh
      - name: Capture audit-process replay evidence
        if: always()
        run: |
          PYTHONPATH=experimental python3 -m playground.audits.tolman_process \
            --output-dir "$RUNNER_TEMP/tolman-audit-process"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tolman-audit-process-python-${{ matrix.python }}
          path: ${{ runner.temp }}/tolman-audit-process
          if-no-files-found: error
